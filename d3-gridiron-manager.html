<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<script>window.D3DESKTOP = true;</script>
<style>:root{color-scheme:light}body{margin:0;font-size:14px;font-family:system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
</head><body>
<title>D3 Gridiron Manager</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@500;600;700&family=Public+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: press-box stat sheet — a sticky scoreboard bar over ruled tables */
:root{
  --bg:#edf0f3; --surface:#ffffff; --ink:#15202b; --muted:#5a6776; --rule:#d4dae1; --chip:#e2e7ec; --hl:#fdf3d6;
  --accent:#1d6b48; --accent-ink:#ffffff; --win:#1d6b48; --loss:#b23a2e;
  --board:#13202d; --board-ink:#eef2f5; --board-dim:#93a4b5; --amber:#f0b43a; --board-rule:#2a3a4a; --amber-ink:#a8740a;
  --f-display:'Saira Condensed','Arial Narrow',sans-serif; --f-body:'Public Sans',system-ui,-apple-system,sans-serif; --f-data:'IBM Plex Mono',ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e141a; --surface:#161f28; --ink:#e4e9ee; --muted:#95a3b1; --rule:#28333e; --chip:#202b36; --hl:#2e2b1b;
  --accent:#4cae7d; --accent-ink:#0b1510; --win:#5cbd8b; --loss:#e3695c;
  --board:#080e14; --board-ink:#eef2f5; --board-dim:#7f91a3; --amber:#f0b43a; --board-rule:#1f2b37; --amber-ink:#f0b43a; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0e141a; --surface:#161f28; --ink:#e4e9ee; --muted:#95a3b1; --rule:#28333e; --chip:#202b36; --hl:#2e2b1b;
  --accent:#4cae7d; --accent-ink:#0b1510; --win:#5cbd8b; --loss:#e3695c;
  --board:#080e14; --board-ink:#eef2f5; --board-dim:#7f91a3; --amber:#f0b43a; --board-rule:#1f2b37; --amber-ink:#f0b43a; color-scheme:dark }
html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font:14px/1.45 var(--f-body);-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--board)}
*{box-sizing:border-box}
button,select,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
.num,td,th{font-variant-numeric:tabular-nums}

/* scoreboard */
.board{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--board);color:var(--board-ink);border-bottom:3px solid var(--amber)}
.board-in{max-width:1180px;margin:0 auto;padding-block:10px 0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-wrap:wrap;align-items:center;gap:10px 22px}
.brand{font:700 26px/1 var(--f-display);letter-spacing:.04em;text-transform:uppercase;display:flex;align-items:baseline;gap:8px}
.brand i{font-style:normal;color:var(--amber)}
.clock{display:flex;gap:14px;align-items:baseline;font-family:var(--f-display)}
.clock .yr{font-size:24px;font-weight:700;color:var(--amber);letter-spacing:.06em}
.clock .ph{font-size:16px;font-weight:600;color:var(--board-ink);text-transform:uppercase;letter-spacing:.08em}
.ctrl{display:flex;gap:8px;flex-wrap:wrap;margin-left:auto}
.btn{border:1px solid var(--board-rule);background:transparent;color:var(--board-ink);padding:7px 12px;border-radius:4px;cursor:pointer;font-weight:600;font-size:13px}
.btn:hover{border-color:var(--board-dim)}
.btn.go{background:var(--amber);border-color:var(--amber);color:#1a1405}
.btn.go:hover{filter:brightness(1.06)}
.yt{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--board-dim);text-transform:uppercase;letter-spacing:.08em}
.yt select{background:var(--board);color:var(--board-ink);border:1px solid var(--board-rule);border-radius:4px;padding:5px 6px;font-size:13px;text-transform:none;letter-spacing:0;max-width:200px}
.tabs{max-width:1180px;margin:0 auto;display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:8px 0}
.tabs::-webkit-scrollbar{display:none}
.tab{background:none;border:0;color:var(--board-dim);font:600 15px/1 var(--f-display);text-transform:uppercase;letter-spacing:.08em;padding:9px 12px 10px;cursor:pointer;border-radius:4px 4px 0 0;white-space:nowrap}
.tab:hover{color:var(--board-ink)}
.tab[aria-selected="true"]{color:#1a1405;background:var(--amber)}

/* page */
main{max-width:1180px;margin:0 auto;padding-block:20px 60px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:20px}
h2{font:700 24px/1.1 var(--f-display);text-transform:uppercase;letter-spacing:.04em;margin:0;text-wrap:balance}
h3{font:600 17px/1.1 var(--f-display);text-transform:uppercase;letter-spacing:.06em;margin:0 0 8px;color:var(--muted)}
.sheet{background:var(--surface);border:1px solid var(--rule);border-radius:6px;padding:14px 16px;min-width:0}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.muted{color:var(--muted)}
.lbl{font-size:11px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);font-weight:600}
.chips{display:flex;gap:4px;flex-wrap:wrap}
.chip{border:1px solid var(--rule);background:var(--surface);padding:5px 10px;border-radius:3px;cursor:pointer;font:600 14px/1 var(--f-display);letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.chip:disabled{opacity:.45;cursor:default}
.sw{display:inline-block;width:4px;height:16px;border-radius:1px;background:var(--tc);vertical-align:-3px;flex:none}
.rk{font:600 12px var(--f-data);color:var(--muted);min-width:22px;display:inline-block}
.tlink{background:none;border:0;padding:0;cursor:pointer;color:inherit;text-align:left;font-weight:600}
.tlink:hover{text-decoration:underline;text-decoration-color:var(--accent)}
.you,.game.you{background:var(--hl)}
.w{color:var(--win)} .l{color:var(--loss)}

/* games */
.games{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.game{display:grid;gap:4px;text-align:left;background:var(--surface);border:1px solid var(--rule);border-radius:6px;padding:10px 12px;cursor:pointer;width:100%}
.game:hover:not(:disabled){border-color:var(--muted)}
.game:disabled{cursor:default}
.gl{display:flex;align-items:center;gap:8px;min-width:0}
.gl .nm{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gl .sc{font:600 20px/1 var(--f-display);min-width:28px;text-align:right}
.gl.lose{color:var(--muted)} .gl.win .nm{font-weight:700}
.gm{display:flex;justify-content:space-between;font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);border-top:1px dashed var(--rule);padding-top:5px;margin-top:2px}

/* tables */
.tw{overflow-x:auto;min-width:0}
table{border-collapse:collapse;width:100%}
th{font:600 11px/1.2 var(--f-body);text-transform:uppercase;letter-spacing:.08em;color:var(--muted);text-align:right;padding:6px 8px;border-bottom:2px solid var(--ink);white-space:nowrap}
td{padding:5px 8px;border-bottom:1px solid var(--rule);text-align:right;white-space:nowrap;font-family:var(--f-data);font-size:13px}
th.t,td.t{text-align:left;font-family:var(--f-body)}
td.t{font-size:14px}
tr:last-child td{border-bottom:0}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,440px),1fr));gap:20px}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,290px),1fr));gap:16px}

/* team */
.thead{display:flex;flex-wrap:wrap;gap:14px 24px;align-items:flex-end;border-left:8px solid var(--tc);padding-left:14px}
.thead h2{font-size:34px}
.stat{display:grid;gap:2px}
.stat b{font:700 22px/1 var(--f-display)}
.bars{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px 20px}
.bar{display:grid;gap:4px}
.bar .tr{height:8px;background:var(--chip);border-radius:2px;overflow:hidden}
.bar .tr i{display:block;height:100%;background:var(--accent)}
.bar .top{display:flex;justify-content:space-between;font-size:12px}
.bar .top b{font-family:var(--f-data)}
.ed{background:transparent;border:1px solid transparent;border-radius:3px;padding:2px 4px;font-family:var(--f-data);font-size:13px}
.ed:hover{border-color:var(--rule)} .ed:focus{border-color:var(--accent);background:var(--surface)}
input.ed[type=number]{width:52px;text-align:right}
input.ed.nmf{width:100px;font-family:var(--f-body)}
select.ed{padding:2px}
.st{display:inline-block;font:600 10px/1 var(--f-body);letter-spacing:.06em;padding:3px 4px;border-radius:2px;background:var(--accent);color:var(--accent-ink)}
.x{background:none;border:0;color:var(--muted);cursor:pointer;font-size:16px;padding:0 4px}
.x:hover{color:var(--loss)}
.form{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px 14px}
.form label{display:grid;gap:4px}
.fi{border:1px solid var(--rule);background:var(--surface);border-radius:4px;padding:6px 8px;width:100%}
.pbtn{border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);border-radius:4px;padding:7px 12px;font-weight:600;cursor:pointer}
.sbtn{border:1px solid var(--rule);background:var(--surface);border-radius:4px;padding:7px 12px;font-weight:600;cursor:pointer}
.sbtn:hover{border-color:var(--muted)}
.dbtn{border:1px solid var(--loss);background:transparent;color:var(--loss);border-radius:4px;padding:7px 12px;font-weight:600;cursor:pointer}
textarea.fi{font-family:var(--f-data);font-size:12px;min-height:120px;resize:vertical}

/* bracket */
.bracket{display:flex;gap:18px;overflow-x:auto;padding-bottom:6px}
.round{display:flex;flex-direction:column;justify-content:space-around;gap:10px;min-width:160px;flex:1}
.bracket .round:not(:last-child) .match{position:relative;overflow:visible}.bracket .round:not(:last-child) .match::after{content:'';position:absolute;right:-19px;top:50%;width:18px;border-top:2px solid var(--rule)}.bracket .round:not(:first-child) .match::before{content:'';position:absolute;left:-10px;top:50%;width:9px;border-top:2px solid var(--rule)}.bracket .round:not(:first-child) .match{position:relative;overflow:visible}
.match{border:1px solid var(--rule);border-radius:5px;background:var(--surface);overflow:hidden;text-align:left;padding:0;cursor:pointer;width:100%}
.match:disabled{cursor:default}
.mt{display:flex;gap:6px;align-items:center;padding:6px 8px;font-size:13px}
.mt+.mt{border-top:1px solid var(--rule)}
.mt .sd{font:500 11px var(--f-data);color:var(--muted);width:18px}
.mt .n{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mt .s{font:600 15px var(--f-display)}
.mt.lose{color:var(--muted)} .mt.win .n{font-weight:700}
.stagg{border-color:var(--amber);box-shadow:0 0 0 1px var(--amber)}

/* modal / box score */
.modal{position:fixed;inset:0;z-index:40;background:rgba(8,14,20,.55);display:flex;justify-content:center;align-items:flex-start;overflow-y:auto;padding:calc(env(safe-area-inset-top,0px) + 24px) max(12px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 24px) max(12px,env(safe-area-inset-left,0px))}
.recap{width:min(560px,100%);border-top:6px solid var(--tc)}.recap .slide{display:grid;justify-items:center;text-align:center;gap:6px;padding:18px 6px;animation:rfade .45s ease}.recap .slide h2{margin:4px 0;font-size:28px}.recap .big{font-size:20px;font-weight:700;margin:0}.recap .dots{display:flex;gap:6px}.recap .dots i{width:8px;height:8px;border-radius:50%;background:var(--rule)}.recap .dots i.on{background:var(--tc)}
@keyframes rfade{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.recap .slide{animation:none}}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin:10px 0}.lcard{display:grid;justify-items:start;gap:2px;text-align:left;padding:10px;border-radius:8px;border:1px solid var(--rule);border-left:5px solid var(--tc);background:var(--surface);color:inherit;font:inherit;cursor:pointer}.lcard .big{font-size:18px;font-weight:700}
.setrow{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:8px 0;border-top:1px solid var(--rule);flex-wrap:wrap}.setrow>div:first-child{flex:1 1 260px;min-width:0}
.tip{border-left:4px solid var(--accent)}.toast{border-left:4px solid #f0b43a}
.achs{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:8px}.ach{display:grid;gap:2px;padding:8px;border:1px dashed var(--rule);border-radius:6px;opacity:.55}.ach.on{opacity:1;border-style:solid;border-color:var(--accent)}
.tempo{gap:4px;flex-wrap:wrap}
li[draggable=true]{cursor:grab}li.dragging{opacity:.4}li.dropto{outline:2px dashed var(--accent);outline-offset:-2px}
.pkgs{display:grid;gap:4px;margin-top:10px}
html.cb{--win:#1f6fb4;--loss:#c76a00}html.big{zoom:1.12}html.calm *,html.calm *::before{animation:none!important;transition:none!important}
.rlist{display:grid;gap:8px}.rcard>*{min-width:0}.rcard{display:grid;grid-template-columns:minmax(170px,1.1fr) minmax(0,1.5fr) minmax(150px,1fr) 172px;gap:8px 16px;align-items:center;padding:10px 12px;border:1px solid var(--rule);border-radius:8px;background:var(--surface)}
.rcard.user{border-left:4px solid var(--win)}.rcard.gone{opacity:.55}.rcard .rc-who{display:flex;gap:10px;align-items:flex-start;min-width:0}.rcard .pos{font-weight:700;font-size:12px;padding:3px 6px;border-radius:4px;background:var(--ink);color:var(--bg);min-width:30px;text-align:center}
.rcard .rname{font-weight:700;font-size:15px;text-transform:none;letter-spacing:0;margin-right:6px}.rcard .stars{color:#c89211;white-space:nowrap}
.rc-stats{display:flex;flex-wrap:wrap;gap:4px 16px;margin:0}.rc-stats dd{white-space:nowrap}.rc-stats dt{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted,#667)}.rc-stats dd{margin:0;font-weight:600}
.rc-int{display:grid;gap:4px;min-width:0}.rc-int .meter{width:100%}.rc-act{display:flex;flex-direction:column;gap:6px;align-items:stretch}.rc-more{grid-column:1/-1;border-top:1px solid var(--rule);padding-top:8px}
.rfilters{display:flex;flex-wrap:wrap;gap:8px;justify-content:space-between;align-items:center}.rhelp summary{cursor:pointer}
@media (max-width:1100px){.rcard{grid-template-columns:1fr 1fr}.rc-act{flex-direction:row;flex-wrap:wrap}}
@media (max-width:640px){.rcard{grid-template-columns:1fr}}
.dmap{width:100%;height:auto;display:block;margin:8px 0;background:var(--chip);border-radius:8px}.dmap .mst{font:10px var(--f-data);fill:var(--muted);opacity:.55;text-anchor:middle}.dmap .md circle{fill:var(--muted);opacity:.45;cursor:pointer}.dmap .md.on circle{fill:var(--tc);opacity:1;stroke:var(--surface);stroke-width:1}.dmap .md:hover circle,.dmap .md:focus circle{opacity:1;stroke:var(--ink);stroke-width:1.5}
.dmap .mu{fill:var(--tc);stroke:var(--amber);stroke-width:3}.dmap .mring{fill:none;stroke:var(--accent);stroke-dasharray:4 4;opacity:.6}.dmap .mrl{font:10px var(--f-data);fill:var(--accent);text-anchor:middle}.dmap .mhs{fill:var(--muted);opacity:.5}.dmap .mhs.good{fill:var(--accent);opacity:.7}.dmap .mhs.pipe{fill:var(--accent);opacity:1}
.cchart{width:100%;max-width:520px;height:auto}.cchart rect{fill:var(--accent)}.cchart .cv{font:10px var(--f-data);fill:var(--ink);text-anchor:middle}.cchart .cs{font:10px var(--f-data);fill:var(--muted);text-anchor:middle}
.box{background:var(--bg);border-radius:8px;width:min(980px,100%);display:grid;gap:16px;padding:16px;min-width:0}
.boxtop{display:flex;justify-content:space-between;align-items:center;gap:10px}
.final{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px;background:var(--board);color:var(--board-ink);border-radius:6px;padding:14px 16px}
.final .side{display:grid;gap:2px;min-width:0}
.final .side:last-child{text-align:right}
.final .ab{font:700 30px/1 var(--f-display);letter-spacing:.04em}
.final .sch{font-size:12px;color:var(--board-dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.final .pts{font:700 44px/1 var(--f-display);color:var(--amber);display:flex;gap:18px;align-items:center}
.final .pts span.dim{color:var(--board-dim)}
.final .tag{font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--board-dim);text-align:center}
.drive{display:grid;grid-template-columns:44px 34px 1fr 108px;gap:8px;align-items:center;font-size:12px;padding:3px 0}
.field{position:relative;height:12px;border-radius:2px;background:repeating-linear-gradient(90deg,var(--chip) 0 calc(10% - 1px),var(--rule) calc(10% - 1px) 10%)}
.field i{position:absolute;top:2px;bottom:2px;border-radius:2px;background:var(--tc)}
.field i.neg{opacity:.5}
.dres{font-family:var(--f-data);font-size:11px;white-space:nowrap}
.dres.sc{font-weight:600;color:var(--win)}
.pbp td{white-space:normal;font-family:var(--f-body);font-size:13px;vertical-align:top}
.pbp td.c{white-space:nowrap;font-family:var(--f-data);font-size:12px;color:var(--muted)}
.pbp tr.hl td{background:var(--hl)}
.pbp tr.qh td{font:600 13px var(--f-display);text-transform:uppercase;letter-spacing:.08em;background:var(--chip);color:var(--ink)}
.board[hidden]{display:none}
.yt .tlink{font-size:14px;text-transform:none;letter-spacing:0}
.sbtn.sm,.pbtn.sm{padding:3px 8px;font-size:12px}
.sbtn:disabled{opacity:.5;cursor:default}
.pbtn:disabled{opacity:.5;cursor:default}
.stars{color:var(--amber-ink);letter-spacing:1px;font-size:12px}
.meter{position:relative;width:80px;height:10px;background:var(--chip);border-radius:2px}
.meter i{position:absolute;inset:0 auto 0 0;background:var(--accent);border-radius:2px}
.meter b{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--ink);margin-left:-1px}
.rhead{display:flex;flex-wrap:wrap;gap:12px 28px;align-items:flex-end}
.rhead>div{display:grid;gap:2px}
.rhead b{font:700 24px/1 var(--f-display)}
.grid-r{display:grid;grid-template-columns:minmax(0,1fr) 260px;gap:16px;align-items:start}
@media (max-width:900px){.grid-r{grid-template-columns:minmax(0,1fr)}}
.rtable td.acts{display:flex;gap:3px}
.rtable td,.rtable th{padding-left:5px;padding-right:5px}
tr.gone td{opacity:.55}
.log{margin:0;padding-left:18px;display:grid;gap:6px;font-size:13px}
.offer{display:flex;gap:12px;align-items:center;border:1px solid var(--rule);border-radius:6px;padding:10px 12px;background:var(--surface)}
.offer>div{flex:1;min-width:0}
.grade{font-size:30px!important}
.gA,.gB{color:var(--win)} .gD,.gF{color:var(--loss)}
.tr.sec i{background:var(--amber)}
.mt.you,.game.you{background:var(--hl)}
.modal.solid{background:var(--bg)}
.setup{gap:18px;max-width:900px}
.pickgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,260px),1fr));gap:8px}
.pick{display:flex;gap:10px;align-items:center;text-align:left;border:1px solid var(--rule);background:var(--surface);border-radius:6px;padding:10px 12px;cursor:pointer}
.pick>span:nth-child(2){flex:1;min-width:0}
.pick .sw{height:30px;width:5px}
.pick:hover{border-color:var(--muted)}
.pick.on{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent)}
.pp{font:700 22px/1 var(--f-display);color:var(--muted)}
.pick.on .pp{color:var(--accent)}
.live{max-width:860px}
.lsb{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;background:var(--board);color:var(--board-ink);border-radius:6px;padding:12px 16px}
.lt{display:flex;align-items:center;gap:8px;font:700 24px/1 var(--f-display);letter-spacing:.04em;min-width:0}
.lt.r{justify-content:flex-end}
.lscore{font:700 42px/1 var(--f-display);color:var(--amber);min-width:44px;text-align:center}

function notableOf(school) {
  return NOTABLE_EARLY[school] || [];
}

function programMemoryNote(st, t) {
  // Living-world: when a program has notable early lore and the career is in or past that era, surface a short memory
  const notes = notableOf(t.school);
  if (!notes.length) return '';
  const y = st.season;
  const past = notes.filter(([ny]) => ny <= y);
  if (!past.length) return '';
  const [ny, text] = past[past.length - 1];
  return `${t.school} still carries the memory of ${ny}: ${text}.`;
}

// Persistent notes about past meetings so rivalries feel continuous across seasons.
function ensureRivalMem(st) {
  if (!st.rivalMem) st.rivalMem = {}; // key: "idA|idB" sorted → { last: year, streak: n, note: str, meetings: n }

}
function rivalKey(a, b) {
  return a < b ? a + '|' + b : b + '|' + a;

  if (!g || !g.done || g.hs == null) return;
  const RM = ensureRivalMem(st);
  const k = rivalKey(g.h, g.a);
  const rec = RM[k] || { meetings: 0, streak: 0, last: 0, leader: null, note: '' };
  rec.meetings++;
  rec.last = st.season;
  const homeWon = g.hs > g.as, tie = g.hs === g.as;
  if (tie) { rec.streak = 0; rec.leader = null; rec.note = `Last meeting ${st.season} ended level.`; }
  else {
    const winner = homeWon ? g.h : g.a;
    if (rec.leader === winner) rec.streak++;
    else { rec.leader = winner; rec.streak = 1; }
    const W = teamById(st, winner), L = teamById(st, homeWon ? g.a : g.h);
    if (W && L) {
      if (rec.streak >= 3) rec.note = `${W.school} has taken ${rec.streak} straight from ${L.school} (last in ${st.season}).`;
      else if (rec.meetings >= 5 && rec.streak === 1) rec.note = `${W.school} edged ${L.school} in ${st.season}; the series is ${rec.meetings} meetings old.`;
      else rec.note = `Last meeting: ${W.school} over ${L.school}, ${st.season}.`;
    }
  }
  RM[k] = rec;
}
function rivalMemoryNote(st, t, oppId) {
  const RM = ensureRivalMem(st);
  const rec = RM[rivalKey(t.id, oppId)];
  if (!rec || !rec.note) return '';

}
function conferenceRepNote(st, t) {
  // Light living-world: how the program is regarded inside its conference this decade
  if (!t || t.guest) return '';
  const rec = (st.records && st.records[t.id]) || null;
  const conf = t.conf;
  if (!conf || conf === 'INDEPE') return t.prestige >= 70 ? 'Respected independent.' : t.prestige <= 35 ? 'Still building a name on its own.' : '';
  const peers = st.teams.filter(x => x.conf === conf && x.id !== t.id);
  if (!peers.length) return '';
  const better = peers.filter(x => x.prestige > t.prestige + 8).length;
  const weaker = peers.filter(x => x.prestige < t.prestige - 8).length;
  if (t.prestige >= 75 && better === 0) return `Currently sets the standard in the ${confOf(conf).short || conf}.`;

}

// Win probability from the play-by-play: score margin, time left and field position
function wpSeries(g) {
  if (!g.pbp || !g.pbp.length || g.pbp[0].length < 10) return null;
  const pts = [];
  for (const e of g.pbp) {
    const q = e[0] === 'OT' || /OT/.test(e[0]) ? 5 : +e[0].slice(1), c = e[1] ? e[1].split(':').map(Number) : [0, 0], left = q >= 5 ? 0 : (4 - q) * 900 + c[0] * 60 + c[1];
    const diff = e[8] - e[9], fp = e[2] === 0 ? (e[7] - 50) / 50 : -(50 - e[7]) / 50;
    const z = diff / (Math.sqrt(Math.max(30, left) / 3600) * 13) + fp * .35 * (left > 60 ? 1 : .2) + .12;
    pts.push([3600 - Math.max(0, left), 1 / (1 + Math.exp(-z * 1.6))]);
  }
  pts.push([3600, g.hs > g.as ? 1 : g.hs < g.as ? 0 : .5]);

}

  return `<div class="sheet"><div class="row" style="justify-content:space-between"><h3 style="margin:0">Win probability</h3><span class="note">${esc(h.abbr)} on top · ${esc(a.abbr)} below</span></div>
   <svg viewBox="0 0 ${W} ${H}" width="100%" height="120" preserveAspectRatio="none" role="img" aria-label="Win probability over the game"><rect width="${W}" height="${H / 2}" fill="${esc(h.color)}" opacity=".08"/><rect y="${H / 2}" width="${W}" height="${H / 2}" fill="${esc(a.color)}" opacity=".08"/>${[1, 2, 3].map(q => `<line x1="${x(q * 900)}" x2="${x(q * 900)}" y1="0" y2="${H}" stroke="currentColor" opacity=".15"/>`).join('')}<line x1="0" x2="${W}" y1="${H / 2}" y2="${H / 2}" stroke="currentColor" opacity=".25" stroke-dasharray="4 4"/><path d="${d}" fill="none" stroke="${esc(h.color)}" stroke-width="2.5" vector-effect="non-scaling-stroke"/></svg>
   <div class="row note" style="justify-content:space-between"><span>Q1</span><span>Q2</span><span>Q3</span><span>Q4</span><span>Final</span></div></div>`;

function ncSorted(wk) { const u = T(st.userTeam), o = nonconfOptions(st, wk); for (const x of o) x.fit = scheduleFit(st, u, x.t); if ((ui.ncsort || 'fit') === 'fit') o.sort((a, b) => b.fit.score - a.fit.score); else if (ui.ncsort === 'peers') o.sort((a, b) => (acadPeer(u, b.t) ? 1 : 0) - (acadPeer(u, a.t) ? 1 : 0) || a.mi - b.mi); else if (ui.ncsort === 'prestige') o.sort((a, b) => b.t.prestige - a.t.prestige); else if (ui.ncsort === 'match') o.sort((a, b) => Math.abs(a.t.prestige - u.prestige) - Math.abs(b.t.prestige - u.prestige)); return o.filter(x => x.mi < 1500 || acadPeer(u, x.t)).slice(0, 60); }

function moveDepth(t, pid, dir) {

    ${RB.log.length ? `<h4 style="margin:10px 0 4px">Recently broken</h4><ul class="tl">${RB.log.slice(0, 6).map(x => `<li>${x.season}: ${esc(x.who.n)} (${esc(x.who.school)}), ${x.scope === 'game' ? 'single-game' : x.scope === 'season' ? 'single-season' : 'career'} ${esc(x.label.toLowerCase())}, ${x.v} <span class="note">(was ${x.prev.v}, ${esc(x.prev.n)})</span></li>`).join('')}</ul>` : ''}</section>` : '';
  const hof = (st.hof || []).length ? `<section class="sheet"><h3>Hall of Fame</h3><div class="tw"><table><thead><tr><th>Class</th><th class="t">Inductee</th><th class="t">School</th><th class="t">Career</th></tr></thead><tbody>${st.hof.slice().reverse().map(h => `<tr class="${h.tid === st.userTeam ? 'you' : ''}"><td>${h.cls}</td><td class="t"><b>${esc(h.n)}</b> <span class="muted">${esc(PL(h))}</span></td><td class="t">${esc(h.school)}</td><td class="t note">${esc(h.line)}${h.awards && h.awards.length ? '<br>' + esc(h.awards.join(', ')) : ''}</td></tr>`).join('')}</tbody></table></div></section>` : '<section class="sheet"><h3>Hall of Fame</h3><p class="note">Players become eligible two seasons after their final game. The first class is chosen a few seasons into your career.</p></section>';

  const origins = `<section class="sheet"><h3>Origins of the Game</h3>
    <p style="margin:0 0 8px">American college football did not spring fully formed from rugby. Between 1880 and 1912 a handful of rules written largely by <b>Walter Camp of Yale</b> turned a contested scrum game into the distinct sport still played today.</p>
    <div class="tw"><table><thead><tr><th>Year</th><th class="t">What changed</th></tr></thead><tbody>
      <tr><td>1880</td><td class="t">Eleven men a side; line of scrimmage replaces the rugby scrum; the quarter-back takes the snap-back.</td></tr>
      <tr><td>1882</td><td class="t">Camp invents downs-and-distance: three downs to gain five yards. The chalk lines create the “gridiron.”</td></tr>
      <tr><td>1883</td><td class="t">Numerical scoring replaces the old goals-first system.</td></tr>
      <tr><td>1888</td><td class="t">Tackling below the waist legalized; open running dies; mass play and wedges are born.</td></tr>
      <tr><td>1892–94</td><td class="t">Flying wedge peaks, then momentum plays are banned; mass formations remain.</td></tr>
      <tr><td>1905</td><td class="t">Crisis year: ~18 deaths, 100+ serious injuries. Roosevelt summons Harvard, Yale and Princeton. Intercollegiate Athletic Association (future NCAA) founded.</td></tr>
      <tr><td>1906</td><td class="t">Reform rules: restricted forward pass, ten yards in three downs, neutral zone, six men on the line. Interlocking mass finished.</td></tr>
      <tr><td>1910–12</td><td class="t">Four quarters; four downs to gain ten yards; touchdown worth six; 100-yard field with end zones. The modern framework is complete.</td></tr>
    </tbody></table></div>
    <p class="note" style="margin:8px 0 0">When your career reaches these years the campus and town papers will carry the news. The <b>This era</b> panel on your Team page always shows the rules in force for the current season. Programs with deep early histories also carry a <b>Program memory</b> note on their Program profile once your career has reached those years.</p>
  </section>`;
  return `${almanac()}${origins}${champs}${nat}${rb}${hof}${aa}${acad}${legends}${caro}${chg}`;
}

// ----- team stat pages -----
function teamStats(t) {
  const P = t.roster.filter(p => p.s && p.s.g);

  const pct = (a, b) => b ? (a / b * 100).toFixed(1) : '–';
  return `<details class="sheet"><summary>${st.season} player stats</summary><div class="grid2" style="margin-top:10px">
   ${tb('Passing', p => p.s.pa, [['C', s => s.pc || 0], ['Att', s => s.pa], ['Pct', s => pct(s.pc || 0, s.pa)], ['Yds', s => s.py || 0], ['TD', s => s.ptd || 0], ['Int', s => s.pint || 0]], 'py')}

   ${tb('Receiving', p => p.s.rec, [['Rec', s => s.rec], ['Yds', s => s.rcy || 0], ['Avg', s => ((s.rcy || 0) / s.rec).toFixed(1)], ['TD', s => s.rctd || 0]], 'rcy')}
   ${tb('Defense', p => p.s.tk || p.s.int || p.s.sk, [['Tk', s => s.tk || 0], ['TFL', s => s.tfl || 0], ['Sk', s => s.sk || 0], ['Int', s => s.int || 0], ['FF', s => s.ff || 0]], 'tk')}
   ${tb('Kicking', p => p.s.fga || p.s.xpa, [['FG', s => `${s.fgm || 0}/${s.fga || 0}`], ['XP', s => `${s.xpm || 0}/${s.xpa || 0}`]], 'fgm')}
  </div></details>`;
}
function programRecords(t) {
  const lines = [];
  for (const p of t.roster) for (const h of p.hist || []) if (h.tid === t.id || h.school === t.school) lines.push({ pid: p.id, n: nameOf(p), season: h.season, s: h.s });

  for (const p of t.roster) if (p.s && p.s.g) lines.push({ pid: p.id, n: nameOf(p), season: st.season, s: p.s });
  const cats = [['Passing yards', 'py'], ['Passing TD', 'ptd'], ['Rushing yards', 'ry'], ['Rushing TD', 'rtd'], ['Receiving yards', 'rcy'], ['Receptions', 'rec'], ['Tackles', 'tk'], ['Sacks', 'sk'], ['Interceptions', 'int'], ['Field goals', 'fgm']];
  const rows = cats.map(([n, k]) => { const b = lines.filter(l => l.s[k]).sort((a, b) => b.s[k] - a.s[k])[0]; return b ? `<tr><td class="t">${n}</td><td><b>${b.s[k]}</b></td><td class="t">${plink(b.pid, b.n)} <span class="muted">${b.season}</span></td></tr>` : ''; }).join('');
  return rows ? `<section class="sheet"><h3>Program records (single season)</h3><div class="tw"><table><tbody>${rows}</tbody></table></div><p class="note" style="margin:6px 0 0">Records start with this career.</p></section>` : '';

function realScore(st) {

  return { n, hit, fin };
}
function realByDecade(st) {
  const D = {}; for (const s of new Set([...Object.keys(REAL), ...Object.keys(st.realX || {})])) for (const y of realYears(st, s)) { const e = realRec(st, s, y); if (e && e.w != null) { const d = Math.floor(y / 10) * 10; D[d] = (D[d] || 0) + 1; } }

}
function realPanel() {

   <textarea class="fi" id="realcsv" rows="3" placeholder="Wabash,1977,11,2,0,R" aria-label="Real results to import"></textarea>

   <details><summary style="font-size:14px">Coverage by program</summary><p class="note" style="margin:8px 0">Seasons with a real record on file for each program in this league, longest first. ${(() => { const z = st.teams.filter(t => !realYears(st, t.school).some(y => { const e = realRec(st, t.school, y); return e && e.w != null; })); return z.length ? `Nothing on file yet for ${z.length}: ${z.slice(0, 40).map(t => esc(t.school)).join(', ')}${z.length > 40 ? ' and more' : ''}.` : 'Every program has at least one season.'; })()}</p><div class="tw" style="max-height:300px;overflow:auto"><table><thead><tr><th class="t">Program</th><th>Seasons</th><th class="t">Span</th></tr></thead><tbody>${st.teams.map(t => { const ys = realYears(st, t.school).filter(y => { const e = realRec(st, t.school, y); return e && e.w != null; }); return [t.school, ys]; }).filter(x => x[1].length).sort((a, b) => b[1].length - a[1].length).map(([n, ys]) => `<tr><td class="t">${esc(n)}</td><td>${ys.length}</td><td class="t">${ys[0]}–${ys[ys.length - 1]}${ys[ys.length - 1] - ys[0] + 1 > ys.length ? ' (with gaps)' : ''}</td></tr>`).join('')}</tbody></table></div></details>

}

function helpHTML() {
  const k = HELP.some(h => h[0] === ui.help) ? ui.help : 'basics', H = HELP.find(h => h[0] === k);
  return `<div class="box" role="dialog" aria-modal="true" aria-label="How to play" style="width:min(760px,100%)"><div class="boxtop"><h2 style="margin:0">How to play</h2><button class="sbtn" data-act="helpx">Close</button></div>
   <div class="chips">${HELP.map(([id, n]) => `<button class="chip" aria-pressed="${id === k}" data-act="help" data-id="${id}">${n}</button>`).join('')}</div>
   <section class="sheet" style="display:grid;gap:8px"><h3 style="margin:0">${H[1]}</h3>${H[2].map(p => `<p style="margin:0">${p}</p>`).join('')}</section>
   <p class="note" style="margin:0">D3 Gridiron Manager ${esc(appVersion())}. Schools and conferences are real; players, game results and most coaches are simulated.</p></div>`;
}
