<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gridiron Manager — Division III Football, 1880–2026</title>
<style>
@import url("https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Oswald:wght@500;600;700&display=swap");


:root {
  --bg: #f3f4f6;
  --surface: #ffffff;
  --surface-2: #f7f7f8;
  --ink: #16151a;
  --muted: #74727c;
  --subtle: #a4a2aa;
  --rule: #e7e5e9;
  --purple: #4c1d7b;
  --purple-2: #6d35a3;
  --purple-soft: #f2ecf8;
  --gold: #e5b94f;
  --green: #26865e;
  --red: #c84d52;
  --shadow: 0 10px 30px rgba(29, 19, 39, 0.07);
  font-family: "DM Sans", sans-serif;
  color: var(--ink);
  background: var(--bg);
  font-synthesis: none;
}

:root[data-theme="dark"] {
  --bg: #121116;
  --surface: #1b191f;
  --surface-2: #232027;
  --ink: #f2eff4;
  --muted: #aaa5b0;
  --subtle: #7f7985;
  --rule: #312d36;
  --purple: #a66bd8;
  --purple-2: #c695eb;
  --purple-soft: #2e2139;
  --gold: #ecc65e;
  --green: #58b68b;
  --red: #e17377;
  --shadow: 0 12px 34px rgba(0, 0, 0, 0.24);
}

@layer base {
  * {
    box-sizing: border-box;
  }
  html {
    background: var(--bg);
  }
  body {
    margin: 0;
    min-width: 320px;
    min-height: 100vh;
    background: var(--bg);
    color: var(--ink);
  }
  button,
  input {
    font: inherit;
  }
  button {
    color: inherit;
  }
  button:focus-visible,
  input:focus-visible {
    outline: 3px solid color-mix(in srgb, var(--purple) 28%, transparent);
    outline-offset: 2px;
  }
}

button {
  border: 0;
  cursor: pointer;
}
.app-shell {
  min-height: 100vh;
  background: var(--bg);
}
.sidebar {
  position: fixed;
  inset: 0 auto 0 0;
  z-index: 30;
  width: 248px;
  display: flex;
  flex-direction: column;
  padding: 0 14px 18px;
  background: #17131d;
  color: #fff;
}
.brand {
  height: 78px;
  display: flex;
  align-items: center;
  gap: 11px;
  padding: 0 8px;
  border-bottom: 1px solid rgba(255, 255, 255, 0.08);
}
.brand-ball {
  width: 39px;
  height: 39px;
  display: grid;
  place-items: center;
  border-radius: 50%;
  background: var(--gold);
  color: #24162e;
  font: 700 13px/1 "Oswald";
  transform: rotate(-8deg);
  box-shadow: inset 0 0 0 2px rgba(255, 255, 255, 0.26);
}
.brand-ball::before,
.brand-ball::after {
  content: "";
  position: absolute;
  width: 25px;
  height: 1px;
  background: rgba(53, 32, 67, 0.35);
}
.brand-ball::before {
  transform: rotate(72deg);
}
.brand-ball::after {
  transform: rotate(-18deg);
}
.brand-ball span {
  z-index: 1;
}
.brand > div:nth-child(2) {
  display: grid;
  line-height: 1;
}
.brand b {
  font: 700 21px "Oswald";
  letter-spacing: 0.04em;
  text-transform: uppercase;
}
.brand span {
  margin-top: 4px;
  color: #aaa2b2;
  font-size: 10px;
  text-transform: uppercase;
  letter-spacing: 0.24em;
}
.season-chip {
  width: calc(100% - 8px);
  margin: 18px 4px 8px;
  padding: 10px 11px;
  display: grid;
  grid-template-columns: 1fr auto;
  gap: 2px 8px;
  align-items: center;
  border: 1px solid rgba(255, 255, 255, 0.09);
  border-radius: 9px;
  background: rgba(255, 255, 255, 0.04);
  color: #fff;
  text-align: left;
}
.season-chip:hover {
  border-color: rgba(229, 185, 79, 0.45);
  background: rgba(255, 255, 255, 0.07);
}
.season-chip span {
  grid-column: 1/-1;
  color: #948c9e;
  font-size: 9px;
  text-transform: uppercase;
  letter-spacing: 0.14em;
}
.season-chip b {
  font-size: 12px;
}
.season-chip svg {
  color: #8f8797;
}
.main-nav {
  display: grid;
  gap: 3px;
}
.main-nav p {
  margin: 17px 10px 6px;
  color: #736b7c;
  font-size: 9px;
  font-weight: 700;
  letter-spacing: 0.16em;
  text-transform: uppercase;
}
.main-nav button {
  position: relative;
  display: flex;
  align-items: center;
  gap: 12px;
  min-height: 42px;
  padding: 0 11px;
  border-radius: 8px;
  background: transparent;
  color: #aaa4af;
  font-size: 13px;
  text-align: left;
  transition: 0.18s ease;
}
.main-nav button:hover {
  background: rgba(255, 255, 255, 0.05);
  color: #fff;
}
.main-nav button.active {
  background: linear-gradient(90deg, rgba(111, 55, 154, 0.55), rgba(111, 55, 154, 0.16));
  color: #fff;
  box-shadow: inset 3px 0 var(--gold);
}
.main-nav button.active svg {
  color: var(--gold);
}
.main-nav button span {
  flex: 1;
}
.main-nav em {
  min-width: 20px;
  padding: 2px 5px;
  border-radius: 10px;
  background: var(--gold);
  color: #2f193e;
  font-size: 10px;
  font-style: normal;
  font-weight: 700;
  text-align: center;
}
.coach-card {
  margin-top: auto;
  display: flex;
  align-items: center;
  gap: 9px;
  padding: 13px 8px 0;
  border-top: 1px solid rgba(255, 255, 255, 0.08);
}
.avatar {
  width: 34px;
  height: 34px;
  display: grid;
  place-items: center;
  border-radius: 50%;
  background: linear-gradient(145deg, #8661a6, #3c2251);
  color: #fff;
  font-size: 11px;
  font-weight: 700;
}
.coach-card > div:nth-child(2) {
  display: grid;
  flex: 1;
}
.coach-card b {
  font-size: 11px;
}
.coach-card span {
  margin-top: 3px;
  color: #837b89;
  font-size: 8px;
  letter-spacing: 0.06em;
}
.icon-btn {
  width: 38px;
  height: 38px;
  display: grid;
  place-items: center;
  border-radius: 8px;
  background: transparent;
  color: var(--muted);
}
.icon-btn:hover {
  background: var(--surface-2);
  color: var(--ink);
}
.coach-card .icon-btn:hover {
  background: rgba(255, 255, 255, 0.07);
  color: #fff;
}
.mobile-close,
.menu-btn {
  display: none;
}
.main {
  min-height: 100vh;
  margin-left: 248px;
}
.topbar {
  position: sticky;
  top: 0;
  z-index: 20;
  height: 78px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 34px;
  border-bottom: 1px solid var(--rule);
  background: color-mix(in srgb, var(--surface) 94%, transparent);
  backdrop-filter: blur(16px);
}
.topbar-left,
.topbar-actions {
  display: flex;
  align-items: center;
  gap: 9px;
}
.era-status {
  min-height: 39px;
  display: flex;
  align-items: center;
  gap: 8px;
  margin-right: 3px;
  padding: 0 11px;
  border: 1px solid var(--rule);
  border-radius: 8px;
  background: var(--surface);
  text-align: left;
}
.era-status:hover {
  border-color: color-mix(in srgb, var(--purple) 35%, var(--rule));
}
.era-status > svg {
  color: var(--purple);
}
.era-status > span {
  display: grid;
}
.era-status b {
  font-size: 9px;
}
.era-status small {
  color: var(--muted);
  font-size: 7px;
}
.school-name {
  display: grid;
  margin-left: 2px;
}
.school-name b {
  font: 600 14px "Oswald";
  letter-spacing: 0.03em;
  text-transform: uppercase;
}
.school-name span {
  color: var(--muted);
  font-size: 9px;
  letter-spacing: 0.04em;
}
.team-mark {
  position: relative;
  width: 66px;
  height: 66px;
  display: grid;
  place-items: center;
  flex: none;
  border-radius: 50%;
  background: radial-gradient(circle at 38% 30%, #7848a3, #351348 68%);
  border: 3px solid var(--gold);
  box-shadow:
    inset 0 0 0 4px #4e206c,
    0 7px 15px rgba(45, 14, 64, 0.2);
  color: #fff;
  font: 700 34px/1 "Oswald";
  transform: skew(-4deg);
}
.team-mark i {
  position: absolute;
  bottom: 8px;
  width: 30px;
  height: 4px;
  background: var(--gold);
  transform: skew(-25deg);
}
.team-mark--small {
  width: 38px;
  height: 38px;
  border-width: 2px;
  font-size: 19px;
  box-shadow: inset 0 0 0 2px #4e206c;
}
.team-mark--small i {
  bottom: 4px;
  width: 17px;
  height: 2px;
}
.has-dot::after {
  content: "";
  position: absolute;
  top: 8px;
  right: 8px;
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--red);
  border: 2px solid var(--surface);
}
.has-dot {
  position: relative;
}
.advance-btn,
.primary {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  min-height: 40px;
  padding: 0 16px;
  border-radius: 8px;
  background: var(--purple);
  color: #fff;
  font-size: 12px;
  font-weight: 700;
  box-shadow: 0 5px 12px color-mix(in srgb, var(--purple) 22%, transparent);
}
.advance-btn:hover,
.primary:hover {
  background: var(--purple-2);
}
.advance-btn:disabled {
  opacity: 0.68;
  cursor: default;
}
.alerts-wrap {
  position: relative;
}
.popover {
  position: absolute;
  top: calc(100% + 10px);
  right: 0;
  width: 330px;
  padding: 9px;
  border: 1px solid var(--rule);
  border-radius: 12px;
  background: var(--surface);
  box-shadow: var(--shadow);
}
.popover-title {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 8px 9px 10px;
}
.popover-title span {
  color: var(--purple);
  font-size: 10px;
  font-weight: 700;
}
.alerts > button {
  width: 100%;
  display: flex;
  align-items: flex-start;
  gap: 10px;
  padding: 10px;
  border-radius: 8px;
  background: transparent;
  text-align: left;
}
.alerts > button:hover {
  background: var(--surface-2);
}
.alerts > button svg {
  margin-top: 2px;
  color: var(--purple);
}
.alerts > button span {
  display: grid;
}
.alerts > button b {
  font-size: 11px;
}
.alerts > button small {
  margin-top: 3px;
  color: var(--muted);
  font-size: 9px;
}
.content {
  max-width: 1320px;
  margin: 0 auto;
  padding: 34px;
}
.page-heading {
  display: flex;
  justify-content: space-between;
  align-items: flex-end;
  margin-bottom: 26px;
}
.eyebrow {
  display: flex;
  align-items: center;
  gap: 7px;
  margin-bottom: 8px;
  color: var(--purple);
  font-size: 9px;
  font-weight: 700;
  letter-spacing: 0.15em;
  text-transform: uppercase;
}
.live-dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--green);
  box-shadow: 0 0 0 4px color-mix(in srgb, var(--green) 14%, transparent);
}
.page-heading h1 {
  margin: 0;
  font: 600 clamp(28px, 3vw, 38px)/1.05 "Oswald";
  letter-spacing: -0.02em;
  text-transform: uppercase;
}
.page-heading p {
  margin: 7px 0 0;
  color: var(--muted);
  font-size: 12px;
}
.date-block {
  min-width: 93px;
  display: grid;
  grid-template-columns: 1fr 1fr;
  text-align: right;
}
.date-block span {
  grid-column: 1/-1;
  color: var(--muted);
  font-size: 8px;
  text-transform: uppercase;
  letter-spacing: 0.12em;
}
.date-block b {
  font: 600 19px "Oswald";
}
.date-block small {
  align-self: center;
  color: var(--purple);
  font-size: 9px;
  font-weight: 700;
}
.matchup-card {
  position: relative;
  display: grid;
  grid-template-columns: 1fr 240px;
  min-height: 260px;
  overflow: hidden;
  border-radius: 13px;
  background: #21122d;
  color: #fff;
  box-shadow: 0 16px 34px rgba(37, 19, 52, 0.18);
}
.matchup-card::before {
  content: "";
  position: absolute;
  inset: 0;
  background:
    linear-gradient(120deg, transparent 15%, rgba(134, 75, 170, 0.16), transparent 70%),
    repeating-linear-gradient(90deg, transparent 0 79px, rgba(255, 255, 255, 0.022) 80px);
}
.matchup-card::after {
  content: "";
  position: absolute;
  inset: auto 0 0;
  height: 4px;
  background: linear-gradient(90deg, var(--gold) 0 35%, #5d287c 35% 100%);
}
.matchup-copy {
  z-index: 1;
  padding: 25px 28px;
}
.matchup-kicker {
  display: flex;
  justify-content: space-between;
  color: #bcb2c3;
  font-size: 9px;
  font-weight: 700;
  letter-spacing: 0.11em;
  text-transform: uppercase;
}
.matchup-kicker i {
  color: #8e8395;
  font-style: normal;
}
.matchup-teams {
  display: grid;
  grid-template-columns: 1fr 90px 1fr;
  align-items: center;
  margin-top: 23px;
}
.matchup-team {
  display: flex;
  align-items: center;
  gap: 15px;
}
.matchup-team > div:last-child {
  min-width: 0;
}
.matchup-team span {
  color: var(--gold);
  font: 600 12px "Oswald";
}
.matchup-team h2 {
  margin: 1px 0 3px;
  font: 600 clamp(24px, 3vw, 34px)/1 "Oswald";
  letter-spacing: -0.01em;
  text-transform: uppercase;
  white-space: nowrap;
}
.matchup-team p {
  margin: 0;
  color: #aaa0b2;
  font-size: 10px;
}
.matchup-team p i {
  margin: 0 4px;
  color: #5c5263;
}
.opponent-mark {
  width: 66px;
  height: 66px;
  display: grid;
  place-items: center;
  flex: none;
  border-radius: 50%;
  border: 3px solid #d8b14e;
  background: #111;
  color: #e7c354;
  font: 700 34px "Oswald";
  box-shadow: inset 0 0 0 4px #4c3c0b;
}
.opponent-mark.small {
  width: 38px;
  height: 38px;
  border-width: 2px;
  font-size: 19px;
  box-shadow: inset 0 0 0 2px #4c3c0b;
}
.versus {
  display: grid;
  justify-items: center;
  border-left: 1px solid rgba(255, 255, 255, 0.08);
  border-right: 1px solid rgba(255, 255, 255, 0.08);
}
.versus span {
  color: #8d8294;
  font-size: 8px;
  letter-spacing: 0.15em;
}
.versus b {
  font: 600 27px "Oswald";
}
.versus small {
  color: #8d8294;
  font-size: 8px;
}
.weather-row {
  display: flex;
  align-items: center;
  gap: 7px;
  margin-top: 24px;
  padding-top: 15px;
  border-top: 1px solid rgba(255, 255, 255, 0.08);
  color: #a99fae;
  font-size: 9px;
}
.weather-row svg {
  color: #8ba3bd;
}
.weather-row b {
  color: #fff;
}
.weather-row i {
  width: 1px;
  height: 14px;
  margin: 0 5px;
  background: rgba(255, 255, 255, 0.1);
}
.matchup-aside {
  z-index: 1;
  display: grid;
  align-content: center;
  gap: 18px;
  padding: 22px;
  background: rgba(255, 255, 255, 0.045);
  border-left: 1px solid rgba(255, 255, 255, 0.08);
}
.win-chance {
  display: grid;
  justify-items: center;
  gap: 9px;
}
.win-chance > span {
  color: #9c92a3;
  font-size: 8px;
  letter-spacing: 0.12em;
  text-transform: uppercase;
}
.donut {
  width: 98px;
  height: 98px;
  display: grid;
  place-items: center;
  border-radius: 50%;
  background: conic-gradient(var(--gold) 0 64%, rgba(255, 255, 255, 0.08) 64%);
}
.donut::before {
  content: "";
  position: absolute;
  width: 76px;
  height: 76px;
  border-radius: 50%;
  background: #281936;
}
.donut div {
  z-index: 1;
  display: grid;
  justify-items: center;
}
.donut b {
  font: 600 24px "Oswald";
}
.donut small {
  color: #9c92a3;
  font-size: 8px;
}
.matchup-buttons {
  display: grid;
  gap: 7px;
}
.matchup-buttons .primary {
  background: var(--gold);
  color: #2b1a37;
  box-shadow: none;
}
.secondary {
  min-height: 38px;
  padding: 0 14px;
  border: 1px solid var(--rule);
  border-radius: 8px;
  background: transparent;
  color: var(--ink);
  font-size: 11px;
  font-weight: 700;
}
.matchup-aside .secondary {
  border-color: rgba(255, 255, 255, 0.14);
  color: #c3bac9;
}
.secondary:hover {
  background: var(--surface-2);
}
.dashboard-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 18px;
  margin-top: 18px;
}
.panel {
  border: 1px solid var(--rule);
  border-radius: 11px;
  background: var(--surface);
  box-shadow: 0 2px 8px rgba(25, 16, 32, 0.025);
}
.panel-head {
  min-height: 50px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 18px;
  border-bottom: 1px solid var(--rule);
}
.panel-head > div {
  display: flex;
  align-items: center;
  gap: 8px;
}
.panel-head svg {
  color: var(--purple);
}
.panel-head b {
  font: 600 13px "Oswald";
  text-transform: uppercase;
  letter-spacing: 0.035em;
}
.panel-head > button {
  display: flex;
  align-items: center;
  gap: 5px;
  background: transparent;
  color: var(--purple);
  font-size: 9px;
  font-weight: 700;
}
.pulse-score {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 18px 18px 11px;
}
.pulse-score > div strong {
  font: 600 38px/1 "Oswald";
}
.pulse-score > div span {
  color: var(--subtle);
  font-size: 11px;
}
.pulse-score p {
  display: grid;
  flex: 1;
  margin: 0;
}
.pulse-score p b {
  color: var(--green);
  font-size: 10px;
}
.pulse-score p span {
  color: var(--muted);
  font-size: 8px;
}
.pulse-score > svg {
  color: var(--green);
}
.meter-list {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 14px 20px;
  padding: 7px 18px 19px;
}
.meter-row > div:first-child {
  display: flex;
  justify-content: space-between;
  margin-bottom: 6px;
  font-size: 8px;
}
.meter-row span {
  color: var(--muted);
}
.meter-row b {
  font-size: 8px;
}
.meter {
  height: 5px;
  overflow: hidden;
  border-radius: 3px;
  background: var(--surface-2);
}
.meter i {
  display: block;
  height: 100%;
  border-radius: inherit;
  background: linear-gradient(90deg, var(--purple), #9c68c4);
}
.focus-list {
  padding: 7px 12px 2px;
}
.focus-item {
  width: 100%;
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 7px;
  border-bottom: 1px solid var(--rule);
  background: transparent;
  text-align: left;
}
.focus-item:hover {
  background: var(--surface-2);
}
.focus-item > i {
  width: 18px;
  height: 18px;
  display: grid;
  place-items: center;
  flex: none;
  border: 1px solid var(--rule);
  border-radius: 50%;
}
.focus-item.done > i {
  background: var(--green);
  border-color: var(--green);
  color: #fff;
}
.focus-item.accent > i {
  border-color: var(--purple);
  box-shadow:
    inset 0 0 0 4px var(--surface),
    inset 0 0 0 9px var(--purple);
}
.focus-item > span {
  display: grid;
  flex: 1;
}
.focus-item b {
  font-size: 10px;
}
.focus-item small {
  margin-top: 3px;
  color: var(--muted);
  font-size: 8px;
}
.focus-item > svg {
  color: var(--subtle);
}
.text-button {
  display: flex;
  align-items: center;
  gap: 6px;
  margin: 10px 18px 15px;
  background: transparent;
  color: var(--purple);
  font-size: 9px;
  font-weight: 700;
}
.news-panel {
  grid-column: span 1;
}
.lead-story {
  display: grid;
  grid-template-columns: 40% 1fr;
  gap: 16px;
  padding: 17px 18px 14px;
}
.story-art {
  min-height: 130px;
  display: grid;

  if (y < 1906) return "The " + L().game + " begins. " + pick(["A fair crowd gathers at the grounds.", "Captains meet at midfield for the toss."]) + " Your eleven takes the ball first.";
  if (y < 1958) return "Kickoff. Your eleven receives to open the " + L().game + ".";
  return "Kickoff. Your offense takes the field first.";
}
function quarterLabel() {
  const y = S.career.era;
  const q = S.gameday.quarter;
  if (y < 1912) return q <= 2 ? "First half" : "Second half";
  return ["1st quarter", "2nd quarter", "3rd quarter", "4th quarter"][q - 1] || "Final";
}
function fieldPct() { return clamp(S.gameday.ball, 1, 99); }

function runPlay(key) {
  const gd = S.gameday; if (!gd || gd.phase !== "play") return;
  const sim = simOf();
  const play = gd.playbook.find(function (p) { return p.k === key; });
  if (!play) return;
  const edge = (87 - gd.oppOvr) * 0.05;
  const y = S.career.era;
  let text = "";

  if (play.kind === "special") { /* punt */
    const dist = Math.round(rand(play.g[0], play.g[1]));
    gd.log.push({ t: "punt", text: (y < 1906 ? "A long punt of " + dist + " yards." : "Punt of " + dist + " yards. The other eleven takes over.") });
    oppDrive("The punt pins them back.", "");
    endPossession(false);
    afterPossession();
    return;
  }

  if (play.kind === "pass") {
    const r = Math.random();
    if (sim.pass === "restricted") {
      if (r < 0.45) { gd.log.push({ t: "bad", text: "The forward heave falls incomplete, untouched — by rule a turnover. The crowd groans." }); turnover(); }
      else if (r < 0.55) { gd.log.push({ t: "bad", text: "Intercepted! The half-back's heave is picked off." }); turnover(); }
      else {
        const big = r > 0.9;
        const g2 = Math.round(rand(play.g[0], play.g[1]) * (big ? 1.8 : 1) + edge);
        gd.log.push({ t: "pass", text: (big ? "A startling long completion! " : "The forward heave is caught! ") + gainText(g2, play) });
        advance(g2, play);
      }
    } else {
      if (r < 0.10) { gd.log.push({ t: "bad", text: "Intercepted! The defense takes it away." }); turnover(); }
      else if (r < 0.42) { gd.log.push({ t: "pass", text: y < 1934 ? "The pass falls incomplete." : "Incomplete. The throw sails past the receiver." }); failDown(); }
      else {
        const deep = play.k === "deep" || play.k === "airraid";
        const g2 = Math.round(rand(play.g[0], play.g[1]) * (deep && Math.random() < 0.3 ? 1.5 : 1) + edge);
        gd.log.push({ t: "pass", text: "Complete" + (deep && g2 > 20 ? " — a strike downfield!" : "!") + " " + gainText(g2, play) });
        advance(g2, play);
      }
    }
    finishStep();
    return;
  }

  /* run */
  const g2 = Math.round(clamp(rand(play.g[0], play.g[1]) + edge, -3, 40));
  if (Math.random() < play.risk) {
    gd.log.push({ t: "bad", text: (y < 1906 ? "The ball comes loose in the crush — " + L().team + " loses it!" : "Fumble! The defense recovers.") + " " + fumbleFlavor(y) });
    turnover();
  } else {
    gd.log.push({ t: "run", text: runFlavor(play, g2) + " " + gainText(g2, play) });
    advance(g2, play);
  }
  finishStep();
}
function fumbleFlavor(y) {
  if (y < 1900) return pick(["A scrum of bodies forms over the ball.", "The umpire awards it to the other side."]);
  return pick(["A punishing hit dislodges it.", "The pile turns it over."]);
}
function runFlavor(play, g2) {
  const y = S.career.era;
  if (play.k === "wedge") return g2 >= 8 ? "The wedge crashes ahead through the mass of rushers!" : "The wedge surges, but the defense clogs the hole.";
  if (play.k === "rpo") return g2 >= 6 ? "The mesh fools the linebacker — big room to run." : "The read is covered; modest gain.";
  if (y < 1906) return g2 >= 6 ? pick(["The rush line heaves forward!", "A determined rush through the line."]) : pick(["The rush is held at the line.", "Little ground gained in the grind."]);
  return g2 >= 6 ? pick(["A big hole opens!", "He breaks a tackle and churns forward."]) : pick(["The line holds the point of attack.", "Brought down near the line of scrimmage."]);
}
function gainText(g2, play) {
  if (g2 <= 0) return "No gain.";
  return g2 + (g2 === 1 ? " yard." : " yards.");
}
function advance(g2, play) {
  const gd = S.gameday, sim = simOf();
  gd.ball += g2; gd.gain = g2;
  if (gd.ball >= 100) { scoreTouchdown(); return; }
  if (g2 >= gd.toGo) { gd.down = 1; gd.toGo = Math.min(sim.toGo, 100 - gd.ball); }
  else { gd.down++; gd.toGo -= g2; if (gd.down > sim.downs) { turnoverOnDowns(); } }
}
function failDown() {
  const gd = S.gameday, sim = simOf();
  gd.down++; if (gd.down > sim.downs) turnoverOnDowns();
}
function turnoverOnDowns() {
  const gd = S.gameday;
  const y = S.career.era;
  gd.log.push({ t: "bad", text: (y < 1906 ? "The " + L().team + " falls short of the required ground — the ball goes to the other side." : "Turnover on downs.") });
  oppDrive("Defense gets a stop on downs.", "");
  endPossession(false);
  afterPossession();
}
function turnover() {
  const gd = S.gameday;
  oppDrive("The defense is left on the field too long.", "");
  endPossession(false);
  afterPossession();
}
function scoreTouchdown() {
  const gd = S.gameday, sim = simOf();
  const y = S.career.era;
  gd.you += sim.td;
  gd.log.push({ t: "score", text: (y < 1906 ? "TOUCH " + (y < 1883 ? "DOWN" : "IN GOAL") + "! The ball is carried across the line — " + sim.td + " point" + (sim.td === 1 ? "" : "s") + "." : "TOUCHDOWN! " + sim.td + " points.") });
  if (sim.twoPt) { gd.phase = "pat"; gd.patPending = true; }
  else {
    const p = sim.patP;
    if (Math.random() < p) { gd.you += sim.pat; gd.log.push({ t: "score", text: "The try for goal is good — " + sim.pat + " more." }); }
    else gd.log.push({ t: "bad", text: y < 1912 ? "The try for goal sails wide." : "The extra point is missed." });
    endPossession(true);
    afterPossession();
  }
}
function choosePAT(two) {
  const gd = S.gameday, sim = simOf();
  if (!gd.patPending) return;
  gd.patPending = false;
  if (two) {
    if (Math.random() < 0.45) { gd.you += 2; gd.log.push({ t: "score", text: "Two-point try is good!" }); }
    else gd.log.push({ t: "bad", text: "Two-point try is stuffed." });
  } else {
    if (Math.random() < sim.patP) { gd.you += 1; gd.log.push({ t: "score", text: "Extra point is good." }); }
    else gd.log.push({ t: "bad", text: "Extra point is missed." });
  }
  endPossession(true);
  afterPossession();
}
function tryFieldGoal() {
  const gd = S.gameday, sim = simOf();
  const dist = (100 - gd.ball) + 17;
  const p = clamp(sim.fgSkill - (dist - 20) * 0.015, 0.05, 0.95);
  const y = S.career.era;
  if (Math.random() < p) {
    gd.you += sim.fg;
    gd.log.push({ t: "score", text: (y < 1934 ? "GOAL FROM THE FIELD! " + sim.fg + " points." : "Field goal is good from " + dist + " — " + sim.fg + " points.") });
  } else {
    gd.log.push({ t: "bad", text: (y < 1934 ? "The attempt at goal falls short." : "The field goal misses " + (Math.random() < 0.5 ? "wide" : "short") + " from " + dist + ".") });
  }
  oppDrive("Taking over after the kick.", "");
  endPossession(false);
  afterPossession();
}
function oppDrive(noteIfQuiet, noteIfStop) {
  const gd = S.gameday, sim = simOf();
  const p = clamp(0.2 + (gd.oppOvr - 87) * 0.016 + sim.vol + (sim.oppMod || 0), 0.07, 0.55);
  const r = Math.random();
  if (r < p * 0.68) {
    gd.opp += sim.td;
    const patTxt = Math.random() < sim.patP ? (gd.opp += sim.pat, " The try for goal is good.") : (S.career.era < 1912 ? " The try for goal fails." : " Extra point missed.");
    gd.log.push({ t: "opp", text: "Opponent touchdown." + patTxt });
  } else if (r < p) {
    gd.opp += sim.fg;
    gd.log.push({ t: "opp", text: S.career.era < 1934 ? "Opponent kicks a goal from the field." : "Opponent field goal." });
  } else if (r < p + 0.12) {
    gd.log.push({ t: "def", text: "Your defense forces a punt." });
  } else {
    gd.log.push({ t: "def", text: noteIfQuiet || "Opponent drive comes up short." });
  }
}
function endPossession(scored) {
  const gd = S.gameday;
  gd.drivesDone++;
  gd.ball = 30 + Math.round(rand(-8, 12));
  gd.down = 1; gd.toGo = simOf().toGo;
}
function afterPossession() {
  const gd = S.gameday;
  gd.quarter = Math.min(4, Math.floor(gd.drivesDone / (gd.drives / 4)) + 1);
  if (gd.drivesDone >= gd.drives) {
    gd.phase = "done";
    finishGame();
  } else {
    gd.phase = "play";
  }
}
function finishStep() {
  const gd = S.gameday;
  if (gd.phase === "play" && gd.down > simOf().downs) { /* handled in advance */ }
  render();
}

function finishGame() {
  const gd = S.gameday, sim = simOf();
  const g = S.career.schedule[gd.weekIdx];
  const res = gd.you > gd.opp ? "W" : gd.you < gd.opp ? "L" : "T";
  g.result = { res: res, you: gd.you, opp: gd.opp };
  S.career.week = S.career.schedule.indexOf(nextGame()) === -1 ? S.career.schedule.length : S.career.week + 1;
  const y = S.career.era, lg = L();
  const headline = gameHeadline(res, gd.you, gd.opp, g.opponent);
  addNews(pick(paperTags()), headline.title, headline.body);
  /* pulse drift */
  const pu = S.career.pulse;
  if (res === "W") { pu.overall = clamp(pu.overall + 1, 40, 99); pu.fan = clamp(pu.fan + 2, 30, 99); pu.morale = clamp(pu.morale + 2, 30, 99); }
  else if (res === "L") { pu.overall = clamp(pu.overall - 1, 40, 99); pu.fan = clamp(pu.fan - 3, 30, 99); pu.morale = clamp(pu.morale - 4, 30, 99); }
  if (S.career.week >= S.career.schedule.length) {
    S.career.seasonOver = true;
    S.career.summary = buildSeasonSummary();
  }
  save();
}
function paperTags() {
  const y = S.career.era;
  if (y < 1900) return ["The Alliance Review", "Campus Notes"];
  if (y < 1958) return ["The Alliance Review", "Gridiron Chatter"];
  if (y < 1999) return ["The Alliance Review", "College Division Notes"];
  return ["The Alliance Review", "D3football.com", "OAC Weekly"];
}
function gameHeadline(res, you, opp, opponent) {
  const y = S.career.era, lg = L();
  if (res === "W") {
    if (y < 1900) return { title: "The eleven " + lg.win + " " + opponent + " in a hard-fought " + lg.game, body: "Touchdowns and goals tell the story before a lively home crowd." };
    if (y < 1958) return { title: "Mount Union " + lg.win + " " + opponent + ", " + you + "–" + opp, body: "The " + lg.team + " controls the line of scrimmage for four quarters." };
    return { title: "Raiders " + (you - opp > 14 ? "roll past" : you - opp > 3 ? "outlast" : "edge") + " " + opponent + ", " + you + "–" + opp, body: "A conference result with late-season weight." };
  }
  if (res === "L") {
    if (y < 1900) return { title: opponent + " takes the " + lg.game + " from the eleven", body: "A disappointing result the captains vow to answer." };
    return { title: opponent + " edges Mount Union, " + opp + "–" + you, body: "Missed chances prove costly in the " + (y < 1973 ? "conference contest" : "OAC matchup") + "." };
  }
  return { title: "Mount Union and " + opponent + " play to a tie", body: y < 1973 ? "Deadlocks stand in this era — the record shows a tie." : "Overtime rules would settle it; the model defers to the era." };
}

/* ================= season summary / postseason ================= */
function buildSeasonSummary() {
  const y = S.career.era, r = record();
  const wins = r.w;
  let postseason = null, title = null;
  if (y < 1958) {
    postseason = { label: "Postseason", text: "No postseason exists in " + y + ". Rivalry results and regional reputation are the season's only prizes." };
  } else if (y < 1973) {
    if (wins >= 7) { title = "Small-college poll recognition"; postseason = { label: "Small-college poll", text: "With a " + recordStr() + " record, the " + (y >= 1958 ? "Purple Raiders receive votes in the final small-college polls." : "") + " A poll standing is a poll standing — never a playoff title." }; }
    else postseason = { label: "Postseason", text: "No small-college playoff exists. The polls alone name champions in this era." };
  } else {
    if (wins >= 7) {
      const rounds = y < 1999 ? ["Semifinal", "Stagg Bowl"] : ["First round", "Second round", "Quarterfinal", "Semifinal", "Stagg Bowl"];
      let text = "With a " + recordStr() + " record, Mount Union receives a bid to the NCAA Division III playoff";
      if (y === 1973) text += " — the first four-team Division III championship field.";
      else if (y === 1999) text += " through the 28-team automatic-qualification bracket.";
      else text += " under the 40-team playoff model.";
      let round = 0, alive = true;
      while (alive && round < rounds.length) {
        const winP = clamp(0.62 + (87 - 84) * 0.03 - round * 0.08 + 0.12, 0.3, 0.85);
        if (Math.random() < winP) { round++; }
        else alive = false;
      }
      if (round === rounds.length) { text += " The run ends at the top: Stagg Bowl champions."; title = "Stagg Bowl champions"; S.career.titles++; }
      else if (round === 0) text += " The run ends in the " + rounds[0] + ".";
      else text += " The run ends in the " + rounds[round] + ".";
      postseason = { label: "NCAA Division III playoff", text: text };
    } else {
      postseason = { label: "Postseason", text: "No NCAA Division III playoff berth this season." };
    }
  }
  return { record: recordStr(), postseason: postseason, title: title };
}

/* ---------- game-day modal ---------- */
function gdayModal() {
  const gd = S.gameday, sim = simOf();
  const y = S.career.era;
  const own = gd.ball <= 50;
  const spot = own ? "Own " + gd.ball : "Opponent " + (100 - gd.ball);
  const inFgRange = (100 - gd.ball) <= 38;
  const pct = fieldPct();
  const log = gd.log.slice(-9).map(function (e) {
    return '<div class="glog glog--' + e.t + '">' + e.text + "</div>";
  }).join("");
  const plays = gd.playbook.map(function (p) {
    return '<button class="play-btn" data-act="play" data-k="' + p.k + '"><b>' + p.n + "</b><small>" + p.s + "</small></button>";
  }).join("");
  const patUI = gd.patPending
    ? '<div class="gday-pat"><span>Try after the score:</span>' +
      '<button class="primary" data-act="pat" data-two="0">' + (y < 1912 ? "Try for goal" : "Kick the point") + "</button>" +
      '<button class="secondary" data-act="pat" data-two="1">Go for two</button></div>'
    : "";
  const doneUI = gd.phase === "done"
    ? '<div class="gday-final"><h3>' + (gd.you > gd.opp ? "VICTORY" : gd.you < gd.opp ? "DEFEAT" : "A TIE") + "</h3>" +
      "<p>" + (gd.you > gd.opp ? (y < 1906 ? "The eleven prevails. The crowd pours onto the field." : "A win that keeps the season alive.") : y < 1906 ? "The other eleven takes the match." : "A tough one — back to practice.") + "</p>" +
      '<button class="primary" data-act="close-gameday">Continue</button></div>'
    : "";
  return '<div class="modal-backdrop" role="dialog" aria-modal="true" aria-label="Game day" data-act="gday-scrim">' +
    '<div class="modal-card gday">' +
      '<div class="modal-head"><div><span>' + (y < 1912 ? "Match day" : "Game day") + " · " + quarterLabel() + "</span>" +
        "<h2>Mount Union vs " + gd.opponent + "</h2></div>" +
        '<button class="icon-btn" data-act="close-gameday" aria-label="Close">' + icon("x", 19) + "</button></div>" +
      '<div class="gday-bug"><div><small>' + (y < 1958 ? "MOUNT UNION" : "#6 RAIDERS") + "</small><b>" + gd.you + "</b></div>" +
        '<span>' + gd.quarter + " · Drive " + Math.min(gd.drivesDone + 1, gd.drives) + "/" + gd.drives + "</span>" +
        "<div><small>" + gd.opponent.toUpperCase() + "</small><b>" + gd.opp + "</b></div></div>" +
      (gd.phase !== "done"
        ? '<div class="gday-field"><i class="zone"></i><i class="zone zone--r"></i><i class="ball-dot" style="left:' + pct + '%"></i>' +
          '<span class="gday-dd">' + (sim.downs > 0 ? ordinal(gd.down) + " & " + gd.toGo + " · " + spot : "") + "</span></div>" +
          patUI +
          '<div class="gday-plays">' + plays + (inFgRange ? '<button class="play-btn play-btn--kick" data-act="fg"><b>' + (y < 1934 ? "Try for goal from the field" : "Field goal attempt") + "</b><small>" + ((100 - gd.ball) + 17) + "-yard attempt</small></button>" : "") + "</div>"
        : "") +
      '<div class="gday-log">' + log + "</div>" + doneUI + "</div></div>";
}
function ordinal(n) { return n === 1 ? "1st" : n === 2 ? "2nd" : n === 3 ? "3rd" : "4th"; }

/* ================= career lifecycle ================= */
function buildSchedule(year) {
  const pool = oppPool(year).slice();
  const games = [];
  for (let i = 0; i < 9 && pool.length; i++) {
    const idx = Math.floor(Math.random() * pool.length);
    const opponent = pool.splice(idx, 1)[0];
    games.push({
      week: "W" + (i + 1), opponent: opponent,
      venue: i % 2 ? "Away" : "Mount Union Stadium",
      result: null, ovr: Math.round(rand(78, 90)),
      rank: year >= 1999 && Math.random() < 0.4 ? "#" + Math.round(rand(10, 25)) : "",
    });
  }
  return games;
}
function buildRoster(year) {
  const base = [
    ["QB", "Runs the " + (year < 1933 ? "huddle as captain" : "offense")],
    ["RB", year < 1933 ? "The workhorse half-back" : "Power runner"],
    ["WR", year < 1933 ? "Split end" : "Deep threat"],
    ["LB", year < 1933 ? "Anchors the rush line" : "Defensive captain"],
    ["CB", year < 1933 ? "Covers the ends" : "Ball hawk"],
  ];
  return base.map(function (b, i) {
    return { pos: b[0], name: nameFor(year, i), yr: ["SR", "JR", "SR", "JR", "SO"][i], ovr: Math.round(rand(82, 92)), role: b[1] };
  });
}
function buildRecruits(year) {
  if (year < 1900) return [];
  const posList = ["QB", "OT", "CB", "WR"];
  const homes = ["Columbus, OH", "Canton, OH", "Pittsburgh, PA", "Cleveland, OH"];
  return posList.map(function (p, i) {
    return { n: i + 1, name: nameFor(year + 1, i + 5), pos: p, home: homes[i], interest: Math.round(rand(45, 85)), stars: year >= 1999 ? 3 + (i === 0 ? 1 : 0) : 0 };
  });
}
function newCareer(year, keepPulse) {
  const prevPulse = keepPulse ? S.career.pulse : null;
  const titles = keepPulse ? S.career.titles : 0;
  S.career = {
    era: year, week: 0, schedule: buildSchedule(year), seasonOver: false, summary: null,
    pulse: prevPulse || { overall: 82, morale: 88, security: 76, fan: 91, prestige: 84 },
    news: [], titles: titles, playoffText: null,
  };
  S.roster = buildRoster(year);
  S.recruits = buildRecruits(year);
  S.gameday = null;
  const era = ERAS.find(function (e) { return e.year === year; });
  addNews("Season preview", year + " — " + era.label,
    year < 1906 ? "The eleven convenes under " + era.authority.toLowerCase() + ". " + era.language[0] + " is the word of the year."
      : "A new season begins under " + era.authority.toLowerCase() + ".");
  save();
}

/* ================= events ================= */
function bind() {
  root.onclick = onClick;
  root.onchange = onChange;
  const si = document.getElementById("search-input");
  if (si) {
    si.focus();
    si.onkeydown = function (e) { if (e.key === "Escape") { S.searchOpen = false; render(); } };
  }
}
function onClick(e) {
  const el = e.target.closest("[data-act]");
  if (!el) return;
  const act = el.dataset.act;
  switch (act) {
    case "nav": {
      S.page = el.dataset.page;
      S.menuOpen = false;
      window.scrollTo({ top: 0, behavior: "smooth" });
      render(); break;
    }
    case "menu-open": S.menuOpen = true; render(); break;
    case "menu-close": S.menuOpen = false; render(); break;
    case "theme": S.dark = !S.dark; save(); render(); break;
    case "search-open": S.searchOpen = true; render(); break;
    case "search-close": S.searchOpen = false; render(); break;
    case "alerts": S.alertsOpen = !S.alertsOpen; render(); break;
    case "alerts-close": S.alertsOpen = false; render(); break;
    case "alerts-go": S.alertsOpen = false; S.page = el.dataset.page; render(); break;
    case "toast": showToast(el.dataset.msg); break;
    case "advance":
      if (S.career.seasonOver) break;
      if (!S.gameday) startGameday(); else render();
      break;
    case "play": runPlay(el.dataset.k); break;
    case "pat": choosePAT(el.dataset.two === "1"); break;
    case "fg": tryFieldGoal(); break;
    case "close-gameday": case "gday-scrim":
      if (S.gameday && S.gameday.phase === "done") S.gameday = null;
      save(); render(); break;
    case "modal": S.modal = el.dataset.type; S.modalChoice = null; render(); break;
    case "close-modal": case "modal-scrim": S.modal = null; render(); break;
    case "choice": S.modalChoice = el.dataset.choice; render(); break;
    case "confirm-modal": {
      const m = S.modal; S.modal = null;
      showToast(m === "plan" ? "Game plan saved" : "Prospect added to watch list");
      break;
    }
    case "era": S.previewYear = Number(el.dataset.year); render(); break;
    case "begin-era": {
      const y = Number(el.dataset.year);
      newCareer(y, false);
      S.page = "Command Center";
      window.scrollTo({ top: 0, behavior: "smooth" });
      showToast(y + " season begun — era rules are now live");
      break;
    }
    case "resume-2026":
      S.career = defaultState().career; S.roster = defaultState().roster; S.recruits = defaultState().recruits;
      S.gameday = null; save();
      showToast("Returned to the 2026 season");
      render(); break;
    case "next-season":
      newCareer(S.career.era, true);
      S.page = "Command Center";
      window.scrollTo({ top: 0, behavior: "smooth" });
      showToast("A new " + S.career.era + " season begins");
      break;
  }
}
function onChange(e) {
  const el = e.target;
  if (el.dataset && el.dataset.act === "era-select") { S.previewYear = Number(el.value); render(); }
}
document.addEventListener("keydown", function (e) {
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "k") { e.preventDefault(); S.searchOpen = true; render(); }
  if (e.key === "Escape" && S.searchOpen) { S.searchOpen = false; render(); }
});

/* ================= boot ================= */
render();

</script>
</body>
</html>
